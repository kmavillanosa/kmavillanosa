design:
  theme: classic

  page:
    size: us-letter
    top_margin: 0.6in
    bottom_margin: 0.6in
    left_margin: 0.65in
    right_margin: 0.65in
    show_footer: true
    show_top_note: true

  colors:
    body: "212121"
    name: "1a1a1a"
    headline: rgb(90, 90, 90)
    connections: rgb(0, 79, 144)
    section_titles: rgb(0, 79, 144)
    links: rgb(0, 79, 144)
    footer: rgb(140, 140, 140)
    top_note: rgb(140, 140, 140)

  typography:
    line_spacing: 0.65em
    alignment: justified
    date_and_location_column_alignment: right
    font_size:
      body: 10pt
      name: 26pt
      headline: 10pt
      connections: 9.5pt
      section_titles: 1.3em
    small_caps:
      section_titles: true
    bold:
      name: true
      section_titles: true

  links:
    underline: true
    show_external_link_icon: false

  header:
    alignment: center
    photo_width: 3.3cm
    space_below_name: 0.35cm
    space_below_headline: 0.5cm
    space_below_connections: 0.6cm
    connections:
      show_icons: true
      separator: "|"
      space_between_connections: 0.45cm

  section_titles:
    type: with_partial_line
    line_thickness: 0.6pt
    space_above: 0.55cm
    space_below: 0.28cm

  sections:
    allow_page_break: true
    space_between_regular_entries: 1.05em
    space_between_text_based_entries: 0.35em
    show_time_spans_in:
      - experience

  entries:
    date_and_location_width: 4.15cm
    side_space: 0.2cm
    short_second_row: true
    allow_page_break: false
    highlights:
      bullet: "◦"
      space_left: 0.35cm
      space_above: 0.12cm
      space_between_items: 0.18cm
      space_between_bullet_and_text: 0.4em

rendercv_settings:
  render_command:
    dont_generate_markdown: true
    dont_generate_html: true
    dont_generate_pdf: false
    dont_generate_png: true
  bold_keywords: []
