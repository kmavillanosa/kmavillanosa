# Deploy to GitHub Pages + refresh profile metrics (unified).
#
# - Push (app/cms/workflows only): build app, refresh metrics, deploy. Path filter avoids
#   re-running when only README or github-metrics.svg change (e.g. after schedule run).
# - Schedule (daily 00:00 UTC): refresh metrics only (commit github-metrics.svg for profile README).
# - workflow_dispatch: same as push (full build + metrics + deploy).
#
# REQUIRED: METRICS_TOKEN repo secret (PAT, no scopes) for lowlighter/metrics.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'cms/**'
      - '.github/workflows/**'
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check METRICS_TOKEN secret
        run: |
          if [ -z "${{ secrets.METRICS_TOKEN }}" ]; then
            echo "::error::METRICS_TOKEN secret is not set. Create a PAT at https://github.com/settings/tokens (classic, no scopes) and add it as a repository secret named METRICS_TOKEN in this repo's Settings → Secrets and variables → Actions."
            exit 1
          fi

      - name: Generate profile metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          config_timezone: Asia/Manila
          committer_message: "chore: update metrics"
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_introduction: yes
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage
          plugin_achievements: yes
          plugin_achievements_threshold: X
          plugin_achievements_display: detailed
          plugin_calendar: yes
          plugin_calendar_limit: 11
          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes
          plugin_licenses: yes
          plugin_skyline: yes
          plugin_skyline_year: 2024
          plugin_skyline_frames: 120
          plugin_skyline_quality: 1
          plugin_stargazers: yes
          plugin_stargazers_charts_type: chartist
          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons

      - name: Sync repo after metrics commit
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: git pull origin main --rebase || true

      - name: Detect changed paths
        id: paths
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "app=true" >> $GITHUB_OUTPUT
            echo "cms=true" >> $GITHUB_OUTPUT
            echo "workflow=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          git diff --name-only ${{ github.event.before }}..${{ github.sha }} > /tmp/changed.txt || true
          echo "app=$([ -n "$(grep -E '^app/' /tmp/changed.txt 2>/dev/null)" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "cms=$([ -n "$(grep -E '^cms/' /tmp/changed.txt 2>/dev/null)" ] && echo true || echo false)" >> $GITHUB_OUTPUT
          echo "workflow=$([ -n "$(grep -E '^\\.github/' /tmp/changed.txt 2>/dev/null)" ] && echo true || echo false)" >> $GITHUB_OUTPUT

      - name: Cache node_modules
        id: cache-node
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: app/node_modules
          key: node-${{ runner.os }}-${{ hashFiles('app/package-lock.json') }}
          restore-keys: |
            node-${{ runner.os }}-

      - name: Cache CV output
        id: cache-cv
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/cache@v4
        with:
          path: cms/rendercv_output
          key: cv-${{ hashFiles('cms/kmavillanosa_CV.yaml') }}
          restore-keys: cv-

      - name: Setup Node.js
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Setup Python and Install RenderCV
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (steps.paths.outputs.cms == 'true' || steps.cache-cv.outputs.cache-hit != 'true')
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install RenderCV
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (steps.paths.outputs.cms == 'true' || steps.cache-cv.outputs.cache-hit != 'true')
        run: pip install "rendercv[full]"

      - name: Generate CV
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && (steps.paths.outputs.cms == 'true' || steps.cache-cv.outputs.cache-hit != 'true')
        run: rendercv render "cms/kmavillanosa_CV.yaml"

      - name: Copy CV files to public directory
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          mkdir -p app/public/cv
          if [ -f "cms/rendercv_output/Kim_Cyriel_S._Avillanosa_CV.pdf" ]; then
            cp "cms/rendercv_output/Kim_Cyriel_S._Avillanosa_CV.pdf" "app/public/cv/Kim_Cyriel_S._Avillanosa_CV.pdf"
            cp "cms/rendercv_output/Kim_Cyriel_S._Avillanosa_CV.html" "app/public/cv/Kim_Cyriel_S._Avillanosa_CV.html" 2>/dev/null || true
            cp "cms/rendercv_output/Kim_Cyriel_S._Avillanosa_CV.md" "app/public/cv/Kim_Cyriel_S._Avillanosa_CV.md" 2>/dev/null || true
          elif [ -f "cms/rendercv_output/Kim Cyriel S. Avillanosa.pdf" ]; then
            cp "cms/rendercv_output/Kim Cyriel S. Avillanosa.pdf" "app/public/cv/Kim_Cyriel_S._Avillanosa_CV.pdf"
            cp "cms/rendercv_output/Kim Cyriel S. Avillanosa.html" "app/public/cv/Kim_Cyriel_S._Avillanosa_CV.html" 2>/dev/null || true
            cp "cms/rendercv_output/Kim Cyriel S. Avillanosa.md" "app/public/cv/Kim_Cyriel_S._Avillanosa_CV.md" 2>/dev/null || true
          fi

      - name: Install dependencies
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ./app
        run: npm ci

      - name: Build app
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        working-directory: ./app
        run: npm run build

      - name: Setup Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v4

      - name: Copy CMS content, robots.txt, and 404.html to dist
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          cp -r cms dist/cms || true
          cp .nojekyll dist/ 2>/dev/null || touch dist/.nojekyll
          cp app/public/404.html dist/404.html || true
          cp app/public/robots.txt dist/robots.txt || true
          cp app/public/sitemap.xml dist/sitemap.xml || true

      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/deploy-pages@v4
