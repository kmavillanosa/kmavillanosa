# GitHub Metrics - https://github.com/lowlighter/metrics
#
# REQUIRED: Add a Personal Access Token (PAT) as repository secret named METRICS_TOKEN.
# 1. Go to https://github.com/settings/tokens → Generate new token (classic)
# 2. Name it (e.g. "metrics"), no scopes needed for basic metrics
# 3. Repo → Settings → Secrets and variables → Actions → New repository secret
# 4. Name: METRICS_TOKEN  |  Value: paste your token
name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check METRICS_TOKEN secret
        run: |
          if [ -z "${{ secrets.METRICS_TOKEN }}" ]; then
            echo "::error::METRICS_TOKEN secret is not set. Create a PAT at https://github.com/settings/tokens (classic, no scopes) and add it as a repository secret named METRICS_TOKEN in this repo's Settings → Secrets and variables → Actions."
            exit 1
          fi

      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          config_timezone: Asia/Manila
          committer_message: "chore: update metrics"
          template: classic
          base: header, activity, community, repositories, metadata

          plugin_introduction: yes

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          plugin_languages: yes
          plugin_languages_details: bytes-size, percentage

          plugin_achievements: yes
          plugin_achievements_threshold: X
          plugin_achievements_display: detailed

          plugin_calendar: yes
          plugin_calendar_limit: 11

          plugin_habits: yes
          plugin_habits_facts: yes
          plugin_habits_charts: yes

          plugin_licenses: yes

          plugin_skyline: yes
          plugin_skyline_year: 2024
          plugin_skyline_frames: 120
          plugin_skyline_quality: 1

          plugin_stargazers: yes
          plugin_stargazers_charts_type: chartist

          plugin_topics: yes
          plugin_topics_limit: 0
          plugin_topics_mode: icons
