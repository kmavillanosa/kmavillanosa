# GitHub Metrics - generates stats and commits to repo
# See https://github.com/lowlighter/metrics
name: GitHub Metrics
on:
  schedule:
    # Run weekly (Sunday 00:00 UTC)
    - cron: "0 0 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - name: 📊 Generate GitHub metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: github-metrics.svg
          base: header
          config_order: base.header, isocalendar, languages, repositories, activity
          output_action: push
          plugin_isocalendar: yes
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_repositories: yes
          plugin_repositories_featured: ${{ github.repository }}
          plugin_activity: yes
          plugin_activity_limit: 5
